    # debian/source/format
    - echo "3.0 (quilt)" > debian/source/format

    # Update changelog
    - |
      dch --create \
        --package wshowlyrics \
        --newversion "${VERSION}-1~${UBUNTU_RELEASE}1" \
        --distribution ${UBUNTU_RELEASE} \
        "Release ${VERSION}" \
        --force-distribution
      dch --release ""

    # Import GPG key
    - |
      echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --yes --import
      echo "use-agent" >> ~/.gnupg/gpg.conf
      echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
      gpg-agent --daemon --allow-preset-passphrase || true

    # Move the shared orig tarball out to the parent dir (where dpkg-source
    # expects it) and remove the now-empty artifact dir. dpkg-source diffs
    # the whole working tree against the orig, so anything left inside it
    # (the tarball) fails with "cannot represent change ... binary file
    # contents changed". Leaves only the upstream source + debian/ in the tree.
    - mv "ppa-tarball/wshowlyrics_${VERSION}.orig.tar.gz" ../
    - rm -rf ppa-tarball

    # Build source package
    - debuild -S -sa -d -kB4CD9B155AA3124C

    # Setup dput
    - |
      cat > ~/.dput.cf << 'EOF'
      [wshowlyrics-ppa]
      fqdn = ppa.launchpad.net
      method = ftp
      incoming = ~unstable-code/ubuntu/wshowlyrics/
      login = anonymous
      allow_unsigned_uploads = 0
      EOF

    # Upload to PPA
    - |
      CHANGES_FILE="../wshowlyrics_${VERSION}-1~${UBUNTU_RELEASE}1_source.changes"
      dput wshowlyrics-ppa "$CHANGES_FILE"

    - |
      echo "PPA upload for ${UBUNTU_RELEASE} completed!"
      echo "Build status: https://launchpad.net/~unstable-code/+archive/ubuntu/wshowlyrics/+packages"

publish:ppa:jammy:
  stage: publish
  image: ubuntu:22.04
  extends: .tag-only-rules
  needs:
    - job: build:makepkg
    - job: build:fuzz
    - job: publish:ppa:tarball
      artifacts: true
  variables:
    UBUNTU_RELEASE: jammy
    DEBIAN_FRONTEND: noninteractive
  script: *ppa-script

publish:ppa:noble:
  stage: publish
  image: ubuntu:24.04
  extends: .tag-only-rules
  needs:
    - job: build:makepkg
    - job: build:fuzz
    - job: publish:ppa:tarball
      artifacts: true
  variables:
    UBUNTU_RELEASE: noble
    DEBIAN_FRONTEND: noninteractive
  script: *ppa-script
