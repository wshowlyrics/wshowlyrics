# Security stage jobs

security:gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  extends: .source-changes-rules
  needs:
    - job: build:makepkg
      optional: true
    - job: build:fuzz
      optional: true
  variables:
    GIT_DEPTH: 0
  script:
    - gitleaks detect --source="." --verbose --no-git

security:semgrep:
  stage: security
  image: python:3.12-slim
  extends: .source-changes-rules
  needs:
    - job: build:makepkg
      optional: true
    - job: build:fuzz
      optional: true
  script:
    - pip install --quiet semgrep
    # `semgrep scan`: there is no Semgrep account. Do not add back
    # `SEMGREP_APP_TOKEN: $SEMGREP_APP_TOKEN` — with no such CI/CD variable
    # GitLab passes the literal string, semgrep takes it as a token and every
    # scan is refused (#32). --gitlab-sast is the schema reports:sast reads.
    - |
      semgrep scan \
        --metrics=off \
        --config p/security-audit \
        --config p/c \
        --config p/ci \
        --gitlab-sast --output gl-sast-report.json
  artifacts:
    reports:
      sast: gl-sast-report.json
    when: always
